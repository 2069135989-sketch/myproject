# Bootstrap Properties
spring.application.name=my-practice
server.servlet.context-path=/my-practice

# Nacos Config Properties（AK/SK 通过环境变量注入，勿提交明文密钥）
spring.cloud.nacos.config.server-addr=${NACOS_ADDR:mse-5ac47200-nacos-ans.mse.aliyuncs.com:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:qa}
spring.cloud.nacos.config.access-key=${NACOS_GENERAL_ACCESS_KEY:}
